<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Panjabrao Deshmukh Polytechnic — CE Dept Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#160D0A; --panel:#241512; --panel-2:#2B1A15;
    --trace:#F2A93B; --trace-dim:#4A2A1F; --amber:#FFC670;
    --text:#FBEEE0; --muted:#B79484; --err:#FF6B6B; --border:#3A2620;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px;}
  .top-banner{height:6px;background:linear-gradient(90deg,#B3122A,#E0A100,#1F6F78,#B3122A);border-radius:0 0 6px 6px;margin-bottom:20px;}
  .letterhead{border-bottom:2px solid var(--trace-dim);padding-bottom:18px;margin-bottom:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .brand img{width:72px;height:72px;object-fit:contain;}
  .letterhead h1{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;margin:0 0 3px;color:var(--muted);letter-spacing:.02em;}
  .letterhead h2{font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:24px;margin:0 0 4px;color:var(--trace);}
  .letterhead p{margin:0;color:var(--muted);font-size:13px;}
  .form-details{color:var(--amber) !important;font-weight:600;margin-top:4px !important;font-size:13px;}
  .who{margin-top:2px;}
  .who{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--trace);border:1px solid var(--trace-dim);padding:5px 10px;border-radius:3px;display:flex;align-items:center;gap:10px;}
  .who button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;cursor:pointer;text-decoration:underline;padding:0;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.35);}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  label .req{color:var(--amber);}
  input,select,textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:10px 12px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--trace);}
  textarea{resize:vertical;min-height:64px;}
  .err-text{color:var(--err);font-size:12px;margin-top:5px;display:none;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.row2{grid-template-columns:1fr;}}

  .btn{width:100%;padding:12px;border:none;border-radius:6px;background:linear-gradient(135deg,#B3122A,#E0A100);color:#FBEEE0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 2px 14px rgba(0,0,0,.4);}
  .btn:disabled{opacity:.6;cursor:default;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px 14px;border-radius:6px;font-size:12px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
  .btn-ghost:hover{border-color:var(--trace);color:var(--trace);}
  .btn-danger{border-color:#5a2323;color:var(--err);}
  .status{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px;font-family:'IBM Plex Mono',monospace;}
  .hint{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6;}
  .link{color:var(--trace);cursor:pointer;text-decoration:underline;}

  .roles{display:flex;gap:10px;margin-bottom:22px;}
  .role-btn{flex:1;padding:16px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);text-align:center;cursor:pointer;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--muted);}
  .role-btn .sub{display:block;font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px;}
  .role-btn.on{border-color:var(--trace);color:var(--trace);box-shadow:0 0 0 1px var(--trace) inset;}

  .tabs{display:flex;gap:2px;margin-bottom:18px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:3px;width:fit-content;flex-wrap:wrap;}
  .tab{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:6px;cursor:pointer;color:var(--muted);}
  .tab.active{background:var(--panel);color:var(--trace);font-weight:600;box-shadow:0 1px 4px rgba(179,18,42,.15);}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:500;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;}
  .table-wrap{overflow-x:auto;}
  .empty{color:var(--muted);font-size:13px;padding:26px 0;text-align:center;}
  .qrow{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:8px;}
  .qrow .meta{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .toolbar input{width:auto;flex:1;min-width:160px;}
  .banner{background:var(--panel-2);border:1px solid var(--amber);color:var(--amber);font-size:12px;padding:10px 12px;border-radius:6px;margin-bottom:18px;font-family:'IBM Plex Mono',monospace;}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--trace-dim);border-top-color:var(--trace);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const LS_BACKEND = 'ce_backend_url';
const LS_SESSION = 'ce_session';
const DEFAULT_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwLi9fLo-bnCRYXElVsM8CAaup4wvzR69esmTmjiW_ptvN_Cat-7kWmzmxjI_KYTEsavg/exec';
let backendUrl = localStorage.getItem(LS_BACKEND) || DEFAULT_BACKEND_URL;
let currentUser = null;
let pendingRole = null;
let allQuestions = { student: [], teacher: [] };

function esc(s){ const d=document.createElement('div'); d.textContent = s==null?'':String(s); return d.innerHTML; }
function simpleHash(s){
  let h = 0;
  for(let i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h|=0; }
  return 'h'+h;
}

function getSession(){
  try{ const raw = localStorage.getItem(LS_SESSION); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveSession(user){
  try{ localStorage.setItem(LS_SESSION, JSON.stringify(user)); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem(LS_SESSION); }catch(e){}
}

async function callBackend(action, payload){
  const res = await fetch(backendUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload: payload || {} })
  });
  if(!res.ok) throw new Error('Backend returned ' + res.status);
  const data = await res.json();
  return data;
}

function init(){
  if(!backendUrl){ renderConnectScreen(); return; }
  const session = getSession();
  if(session && session.mobile && session.role){
    currentUser = session;
    document.getElementById('who-badge').style.display='flex';
    document.getElementById('who-text').textContent = currentUser.name + ' · ' + currentUser.role;
    loadFormDetails();
    if(currentUser.role==='admin') renderAdmin();
    else renderRoleForm(currentUser.role);
    return;
  }
  renderLogin();
}

/* ---------- CONNECT SCREEN (one-time per browser) ---------- */
function renderConnectScreen(){
  document.getElementById('tagline').textContent = '';
  document.getElementById('app').innerHTML = `
    <div class="card">
      <div class="field">
        <label>Apps Script web app URL <span class="req">*</span></label>
        <input type="text" id="cs-url" placeholder="https://script.google.com/macros/s/.../exec">
        <div class="err-text" id="cs-err">Paste a valid URL ending in /exec.</div>
      </div>
      <button class="btn" id="cs-btn" onclick="connectBackend()">Connect</button>
      <div class="status" id="cs-status"></div>
    </div>
  `;
}
function toggleScript(){
  const el = document.getElementById('setup-block');
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

async function loadFormDetails(){
  const el = document.getElementById('form-details');
  try{
    const res = await callBackend('getSettings', {});
    if(res.ok && res.settings && res.settings.formDetails){
      el.textContent = res.settings.formDetails;
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
  }catch(e){ el.style.display = 'none'; }
}

async function connectBackend(){
  const url = document.getElementById('cs-url').value.trim();
  const err = document.getElementById('cs-err');
  const status = document.getElementById('cs-status');
  err.style.display = 'none';
  if(!url || !url.includes('/exec')){ err.style.display='block'; return; }
  const btn = document.getElementById('cs-btn');
  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span>Checking connection…';
  try{
    backendUrl = url;
    await callBackend('getQuestions', {});
    localStorage.setItem(LS_BACKEND, url);
    status.textContent = 'Connected.';
    renderLogin();
  }catch(e){
    status.textContent = 'Could not reach that URL. Check it was deployed with access set to "Anyone".';
    backendUrl = '';
    console.error(e);
  }finally{
    btn.disabled = false;
  }
}

/* ---------- LOGIN ---------- */
function renderLogin(){
  currentUser = null;
  document.getElementById('who-badge').style.display='none';
  document.getElementById('tagline').textContent = 'Sign in to continue';
  loadFormDetails();
  pendingRole = null;
  document.getElementById('app').innerHTML = `
    <div class="roles">
      <div class="role-btn" id="rb-student" onclick="pickRole('student')">Student<span class="sub">FE / SE / TE</span></div>
      <div class="role-btn" id="rb-teacher" onclick="pickRole('teacher')">Teacher<span class="sub">Faculty</span></div>
      <div class="role-btn" id="rb-admin" onclick="pickRole('admin')">Admin<span class="sub">Incharge</span></div>
    </div>
    <div class="card" id="login-card" style="display:none;">
      <div class="field">
        <label>Mobile number <span class="req">*</span></label>
        <input type="tel" id="l-mobile" placeholder="10-digit number">
        <div class="err-text" id="e-mobile">Enter a valid 10-digit mobile number.</div>
      </div>
      <div class="field">
        <label>Password <span class="req">*</span></label>
        <input type="password" id="l-password" placeholder="Password">
        <div class="err-text" id="e-password">Enter your password.</div>
      </div>
      <div class="field" id="name-field" style="display:none;">
        <label>Full name <span class="req">*</span></label>
        <input type="text" id="l-name" placeholder="Only needed the first time">
      </div>
      <button class="btn" id="login-btn" onclick="doLogin()">Sign in</button>
      <div class="status" id="login-status"></div>
      <div class="hint" id="login-hint"></div>
    </div>
  `;
}

function disconnectBackend(){
  localStorage.removeItem(LS_BACKEND);
  clearSession();
  backendUrl = '';
  renderConnectScreen();
}

function pickRole(role){
  pendingRole = role;
  document.getElementById('rb-student').classList.toggle('on', role==='student');
  document.getElementById('rb-teacher').classList.toggle('on', role==='teacher');
  document.getElementById('rb-admin').classList.toggle('on', role==='admin');
  document.getElementById('login-card').style.display='block';
  document.getElementById('name-field').style.display = 'none';
  document.getElementById('login-hint').textContent = role==='admin'
    ? ''
    : 'Already have an account? Just enter your mobile and password.';
}

async function doLogin(){
  const mobile = document.getElementById('l-mobile').value.trim();
  const password = document.getElementById('l-password').value;
  const nameEl = document.getElementById('l-name');
  const name = nameEl ? nameEl.value.trim() : '';
  document.getElementById('e-mobile').style.display='none';
  document.getElementById('e-password').style.display='none';
  let ok = true;
  if(!/^\d{10}$/.test(mobile)){ document.getElementById('e-mobile').style.display='block'; ok=false; }
  if(!password){ document.getElementById('e-password').style.display='block'; ok=false; }
  if(!ok) return;

  const status = document.getElementById('login-status');
  const btn = document.getElementById('login-btn');
  btn.disabled = true; status.innerHTML = '<span class="spinner"></span>Checking…';

  try{
    const res = await callBackend('login', { mobile, role: pendingRole, passwordHash: simpleHash(password), name });
    if(!res.ok){
      if(res.error === 'NEED_NAME'){
        document.getElementById('name-field').style.display = 'block';
        document.getElementById('l-name').focus();
        status.textContent = 'No account found for this number — enter your name to create one.';
      }
      else status.textContent = res.error || 'Could not sign in.';
      btn.disabled = false; return;
    }
    currentUser = res.user;
    saveSession(currentUser);
    document.getElementById('who-badge').style.display='flex';
    document.getElementById('who-text').textContent = currentUser.name + ' · ' + currentUser.role;
    if(res.seeded){
      const b = document.getElementById('admin-seed-banner');
      b.style.display='block';
      b.textContent = 'This is now the admin account for this sheet. Set a password you will remember — go to Settings to change it any time.';
    } else {
      document.getElementById('admin-seed-banner').style.display='none';
    }
    if(currentUser.role==='admin') renderAdmin();
    else renderRoleForm(currentUser.role);
  }catch(e){
    status.textContent = 'Could not reach the Google Sheet. Check your connection.';
    console.error(e);
  }finally{
    btn.disabled = false;
  }
}

    fieldsHtml += `<div class="field"><label>${esc(q.label)} ${q.required?'<span class="req">*</span>':''}</label>`;
    const opts = (q.options||'').split(',').map(o=>o.trim()).filter(Boolean);
    let errMsg = 'This field is required.';
    if(q.type==='textarea'){
      fieldsHtml += `<textarea id="ans-${q.id}"></textarea>`;
    } else if(q.type==='select'){
      fieldsHtml += `<select id="ans-${q.id}"><option value="">Choose…</option>${opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
    } else if(q.type==='file'){
      fieldsHtml += `<input type="file" id="ans-${q.id}">`;
      errMsg = 'Please attach a file.';
    } else if(q.type==='time'){
      fieldsHtml += `<input type="time" id="ans-${q.id}">`;
    } else if(q.type==='radio' || q.type==='mcq'){
      fieldsHtml += `<div id="ans-${q.id}">${opts.map(o=>`<label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;"><input type="radio" name="ans-${q.id}" value="${esc(o)}" style="width:auto;"> ${esc(o)}</label>`).join('')}</div>`;
      errMsg = 'Please select an option.';
    } else if(q.type==='checkbox'){
      fieldsHtml += `<div id="ans-${q.id}">${opts.map(o=>`<label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;"><input type="checkbox" name="ans-${q.id}" value="${esc(o)}" style="width:auto;"> ${esc(o)}</label>`).join('')}</div>`;
      errMsg = 'Please select at least one option.';
    } else if(q.type==='decision'){
      fieldsHtml += `<label style="display:flex;align-items:center;gap:8px;font-size:14px;"><input type="checkbox" id="ans-${q.id}" style="width:auto;"> Yes</label>`;
      errMsg = 'Please confirm before submitting.';
    } else {
      fieldsHtml += `<input type="${q.type}" id="ans-${q.id}">`;
    }
    fieldsHtml += `<div class="err-text" id="ans-err-${q.id}">${errMsg}</div></div>`;

  const signatureHtml = `
    <div class="field">
      <label>Signature <span class="req">*</span></label>
      <canvas id="sig-pad" width="600" height="160" style="width:100%;max-width:100%;height:140px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;touch-action:none;cursor:crosshair;display:block;"></canvas>

/* ---------- Signature pad ---------- */
let sigCtx = null, sigDrawing = false, sigHasDrawn = false;
function setupSignaturePad(){
  const canvas = document.getElementById('sig-pad');
  if(!canvas) return;
  sigCtx = canvas.getContext('2d');
  sigCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--text') || '#FBEEE0';
  sigCtx.lineWidth = 2;
  sigCtx.lineCap = 'round';
  sigHasDrawn = false;

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x: cx*scaleX, y: cy*scaleY };
  }
  function start(e){ e.preventDefault(); sigDrawing = true; const p = pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); }
  function move(e){ if(!sigDrawing) return; e.preventDefault(); const p = pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); sigHasDrawn = true; }
  function end(){ sigDrawing = false; }

  canvas.onmousedown = start; canvas.onmousemove = move; window.addEventListener('mouseup', end);
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function clearSignature(){
  const canvas = document.getElementById('sig-pad');
  if(!canvas || !sigCtx) return;
  sigCtx.clearRect(0,0,canvas.width,canvas.height);
  sigHasDrawn = false;
  document.getElementById('sig-err').style.display = 'none';
}

function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function submitAnswers(role){
  const qs = allQuestions[role] || [];
  let ok = true;
  const answers = {};

  for(const q of qs){
    const errEl = document.getElementById('ans-err-'+q.id);
    if(q.type==='file'){
      const el = document.getElementById('ans-'+q.id);
      const file = el.files && el.files[0];
      if(q.required && !file){ errEl.style.display='block'; ok=false; continue; }
      errEl.style.display='none';
      if(file){
        try{ answers[q.label] = await fileToDataUrl(file); }
        catch(e){ answers[q.label] = ''; }
      }
    } else if(q.type==='radio' || q.type==='mcq'){
      const checked = document.querySelector(`input[name="ans-${q.id}"]:checked`);
      const val = checked ? checked.value : '';
      if(q.required && !val){ errEl.style.display='block'; ok=false; }
      else { errEl.style.display='none'; answers[q.label] = val; }
    } else if(q.type==='checkbox'){
      const checked = document.querySelectorAll(`input[name="ans-${q.id}"]:checked`);
      const vals = Array.from(checked).map(c=>c.value);
      if(q.required && vals.length===0){ errEl.style.display='block'; ok=false; }
      else { errEl.style.display='none'; answers[q.label] = vals.join(', '); }
    } else if(q.type==='decision'){
      const el = document.getElementById('ans-'+q.id);
      if(q.required && !el.checked){ errEl.style.display='block'; ok=false; }
      else { errEl.style.display='none'; answers[q.label] = el.checked ? 'Yes' : 'No'; }
    } else {
      const el = document.getElementById('ans-'+q.id);
      const val = el.value.trim();
      if(q.required && !val){ errEl.style.display='block'; ok=false; }
      else { errEl.style.display='none'; answers[q.label] = val; }
    }
  }

  const sigErr = document.getElementById('sig-err');
  if(!sigHasDrawn){ sigErr.style.display='block'; ok=false; }
  else sigErr.style.display='none';

  if(!ok) return;

  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('submit-status');
  btn.disabled = true; status.innerHTML = '<span class="spinner"></span>Submitting…';

  answers['Signature'] = document.getElementById('sig-pad').toDataURL('image/png');

  const entry = {
    id: 'E'+Date.now().toString(36).toUpperCase(),
    time: new Date().toISOString(),
    role, mobile: currentUser.mobile, name: currentUser.name,
    answers
  };
  try{
    const res = await callBackend('addSubmission', entry);
    if(!res.ok){
      if(res.error === 'ALREADY_SUBMITTED') status.textContent = 'You have already submitted this form — only one entry per person is allowed.';
      else if(res.error === 'CLOSED') status.textContent = 'This form has closed and is no longer accepting entries.';
      else status.textContent = res.error || 'Could not save your entry.';
      btn.disabled = false;
      return;
    }
    status.textContent = 'Entry recorded. Thank you.';
    qs.forEach(q=>{
      if(q.type==='radio' || q.type==='mcq' || q.type==='checkbox'){
        document.querySelectorAll(`input[name="ans-${q.id}"]`).forEach(i=>i.checked=false);
      } else if(q.type==='decision'){
        const el = document.getElementById('ans-'+q.id); if(el) el.checked = false;
      } else {
        const el = document.getElementById('ans-'+q.id); if(el) el.value = '';
      }
    });
    clearSignature();
  }catch(e){
    status.textContent = 'Could not save your entry. Check your connection and try again.';
    console.error(e);
  }finally{
    btn.disabled = false;
  }
}

function editQuestion(role, id){
  const q = (allQuestions[role]||[]).find(x=>x.id===id);
  if(!q) return;
  editingQuestionId = id;
  document.getElementById('nq-label-caption').textContent = 'Edit question label';
  document.getElementById('nq-label').value = q.label;
  document.getElementById('nq-type').value = q.type;
  document.getElementById('nq-required').checked = !!q.required;
  document.getElementById('nq-options').value = q.options || '';
  const needsOpts = ['select','radio','mcq','checkbox'].includes(q.type);
  document.getElementById('nq-options-wrap').style.display = needsOpts ? 'block' : 'none';
  document.getElementById('nq-submit-btn').textContent = 'Update question';
  document.getElementById('nq-cancel-btn').style.display = 'block';
  document.getElementById('nq-label').scrollIntoView({behavior:'smooth', block:'center'});
  document.getElementById('nq-label').focus();
}

function cancelEditQuestion(role){
  renderQuestionEditor(role);
}

async function addQuestion(role){
  const label = document.getElementById('nq-label').value.trim();
  const type = document.getElementById('nq-type').value;
  const required = document.getElementById('nq-required').checked;
  const options = document.getElementById('nq-options').value.trim();
  const status = document.getElementById('q-status');
  if(!label){ status.textContent = 'Enter a question label first.'; return; }

  allQuestions[role] = allQuestions[role] || [];

  if(editingQuestionId){
    const idx = allQuestions[role].findIndex(x=>x.id===editingQuestionId);
    if(idx===-1){ status.textContent = 'That question no longer exists.'; editingQuestionId=null; return; }
    const q = { id: editingQuestionId, label, type, required };
    if(['select','radio','mcq','checkbox'].includes(type)) q.options = options;
    allQuestions[role][idx] = q;
  } else {
    const q = { id: 'q'+Date.now().toString(36), label, type, required };
    if(['select','radio','mcq','checkbox'].includes(type)) q.options = options;
    allQuestions[role].push(q);
  }

  status.innerHTML = '<span class="spinner"></span>Saving…';
  try{
    const res = await callBackend('saveQuestions', { role, questions: allQuestions[role] });
    if(!res.ok) throw new Error(res.error);
    renderQuestionEditor(role);
  }catch(e){ status.textContent = 'Could not save. Try again.'; }
}

async function removeQuestion(role, id){
  allQuestions[role] = (allQuestions[role]||[]).filter(q=>q.id!==id);
  try{ await callBackend('saveQuestions', { role, questions: allQuestions[role] }); }catch(e){}
  renderQuestionEditor(role);
}

function formVersionLabel(v){

  const ts = parseInt(String(v).replace('v',''), 10);
  if(isNaN(ts)) return String(v);
  return 'Form started ' + new Date(ts).toLocaleDateString();
}

function filterResponses(){
  const roleF = document.getElementById('resp-role-filter').value;
  const formF = document.getElementById('resp-form-filter').value;
  const q = document.getElementById('resp-search').value.trim().toLowerCase();
  const rows = respCache.filter(e =>
    (!roleF || e.role===roleF) &&
    (!formF || (e.formVersion||'v1')===formF) &&
    (!q || (e.name+e.mobile).toLowerCase().includes(q))
  );
  const body = document.getElementById('resp-body');
  const empty = document.getElementById('resp-empty');
  body.innerHTML = '';
  if(rows.length===0){ empty.textContent='No responses match.'; empty.style.display='block'; return; }
  empty.style.display='none';
  rows.forEach(e=>{
    const tr = document.createElement('tr');
    const parts = Object.entries(e.answers||{}).map(([k,v])=>{
      if(typeof v === 'string' && v.startsWith('data:image')){
        return esc(k)+': <a href="'+v+'" download="'+esc(k)+'-'+esc(e.name)+'.png" style="color:var(--trace);">view/download</a>';
      }
      if(typeof v === 'string' && v.startsWith('data:')){
        return esc(k)+': <a href="'+v+'" download="'+esc(k)+'-'+esc(e.name)+'" style="color:var(--trace);">download file</a>';
      }
      return esc(k)+': '+esc(v);
    });
    const ansText = parts.join(' · ');
    tr.innerHTML = `<td>${esc(new Date(e.time).toLocaleString())}</td><td>${esc(formVersionLabel(e.formVersion))}</td><td>${esc(e.role)}</td><td>${esc(e.name)}</td><td>${esc(e.mobile)}</td><td>${ansText}</td>`;
    body.appendChild(tr);
  });
}

async function deleteAllResponses(){
  if(respCache.length===0){ return; }
  const sure = confirm('Delete all ' + respCache.length + ' response(s)? This cannot be undone.');
  if(!sure) return;
  try{
    const res = await callBackend('deleteAllSubmissions', {});
    if(!res.ok) throw new Error(res.error);
    renderResponses();
  }catch(e){
    alert('Could not delete responses. Check your connection and try again.');
  }
}

function exportCSV(){
  if(respCache.length===0) return;
  const keys = new Set();
  respCache.forEach(e=>Object.keys(e.answers||{}).forEach(k=>keys.add(k)));
  const keyList = Array.from(keys);
  const headers = ['Time','Form','Role','Name','Mobile', ...keyList];
  const lines = [headers.map(h=>'"'+h.replace(/"/g,'""')+'"').join(',')];
  respCache.forEach(e=>{
    const row = [e.time, formVersionLabel(e.formVersion), e.role, e.name, e.mobile, ...keyList.map(k=>{
      const v = (e.answers||{})[k] || '';
      return (typeof v === 'string' && v.startsWith('data:')) ? '[attachment - see app to view]' : v;
    })];
    lines.push(row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(','));
  });
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ce_dept_responses.csv'; a.click();
  URL.revokeObjectURL(url);
}

function exportPDF(){
  if(respCache.length===0) return;
  if(!window.jspdf){ alert('PDF library did not load — check your internet connection and try again.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });

  doc.setFontSize(13);
  doc.text('Dr. Panjabrao Deshmukh Polytechnic, Amravati', 14, 15);
  doc.setFontSize(10);
  doc.text('Dept. of Computer Engineering — Form Responses', 14, 21);
  doc.setFontSize(8);
  doc.text('Generated: ' + new Date().toLocaleString(), 14, 26);

  const keys = new Set();
  respCache.forEach(e=>Object.keys(e.answers||{}).forEach(k=>keys.add(k)));
  const keyList = Array.from(keys);
  const headers = ['Time','Form','Role','Name','Mobile', ...keyList];
  const rows = respCache.map(e => [
    new Date(e.time).toLocaleString(), formVersionLabel(e.formVersion), e.role, e.name, e.mobile,
    ...keyList.map(k=>{
      const v = (e.answers||{})[k] || '';
      return (typeof v === 'string' && v.startsWith('data:')) ? '[attachment]' : v;
    })
  ]);

  doc.autoTable({
    head: [headers],
    body: rows,
    startY: 31,
    styles: { fontSize: 7, cellPadding: 2 },
    headStyles: { fillColor: [179, 18, 42], textColor: 255 },
    alternateRowStyles: { fillColor: [250, 240, 230] }
  });

  doc.save('ce_dept_responses.pdf');
}

async function renderSettings(){
  const view = document.getElementById('admin-view');
  let currentDetails = '', currentDeadline = '';
  try{
    const res = await callBackend('getSettings', {});
    if(res.ok && res.settings){
      currentDetails = res.settings.formDetails || '';
      currentDeadline = res.settings.formCloseAt || '';
    }
  }catch(e){}
  view.innerHTML = `
    <div class="card">
      <div class="field">
        <label>Form details / announcement</label>
        <textarea id="form-details-input" placeholder="e.g. Fill this form before Friday, 5 PM. Late entries will not be counted.">${esc(currentDetails)}</textarea>
      </div>
      <button class="btn-ghost" onclick="saveFormDetails()">Save</button>
      <div class="status" id="form-details-status"></div>
      <div class="hint">Shown to everyone right under the department name, in gold, on every screen — use it for deadlines, instructions, or announcements. Leave blank and save to remove it.</div>
      <hr style="border-color:var(--border);margin:20px 0;">
      <div class="field">
        <label>Form closing date &amp; time</label>
        <input type="datetime-local" id="form-deadline-input" value="${esc(currentDeadline)}">
      </div>
      <button class="btn-ghost" onclick="saveDeadline()">Save</button>
      <button class="btn-ghost" onclick="clearDeadline()">Clear (keep form open)</button>
      <div class="status" id="form-deadline-status"></div>
      <div class="hint">After this time, students and teachers can no longer submit — they'll see a "form closed" message instead. Leave empty for no deadline.</div>
      <hr style="border-color:var(--border);margin:20px 0;">
      <div class="field">
        <label>Start a new form</label>
        <div class="hint" style="margin-top:0;">This clears the current Student and Teacher questions so you can set up a completely fresh form, and lets everyone submit again — even people who already filled the old one. All existing responses stay exactly as they are, kept separately under the old form, viewable and filterable by form on the Responses tab.</div>
      </div>
      <button class="btn-ghost btn-danger" onclick="startNewForm()">Start new form (clears current questions)</button>
      <div class="status" id="new-form-status"></div>
      <hr style="border-color:var(--border);margin:20px 0;">
      <div class="field">
        <label>Connected Google Sheet backend</label>
        <input type="text" value="${esc(backendUrl)}" readonly>
      </div>
      <button class="btn-ghost" onclick="disconnectBackend()">Disconnect / change sheet</button>
      <hr style="border-color:var(--border);margin:20px 0;">
      <div class="field">
        <label>Change admin password</label>
        <input type="password" id="new-admin-pass" placeholder="New password">
      </div>
      <button class="btn-ghost" onclick="changeAdminPassword()">Update password</button>
      <div class="status" id="pass-status"></div>
    </div>
  `;
}

async function startNewForm(){
  const sure = confirm('Start a completely new form?\n\n- Current Student and Teacher questions will be cleared — you\'ll need to add new ones.\n- Everyone can submit again, even people who already submitted.\n- All existing responses are kept, unchanged, and stay filterable under the old form.\n\nThis cannot be undone. Continue?');
  if(!sure) return;
  const status = document.getElementById('new-form-status');
  status.innerHTML = '<span class="spinner"></span>Starting…';
  try{
    const res = await callBackend('startNewForm', {});
    if(!res.ok) throw new Error(res.error);
    status.textContent = 'New form started. Go to the question tabs to set up what students and teachers should fill in now.';
  }catch(e){ status.textContent = 'Could not start a new form. Try again.'; }
}

async function saveDeadline(){
  const val = document.getElementById('form-deadline-input').value;
  const status = document.getElementById('form-deadline-status');
  status.innerHTML = '<span class="spinner"></span>Saving…';
  try{
    const res = await callBackend('saveSettings', { key:'formCloseAt', value: val });
    if(!res.ok) throw new Error(res.error);
    status.textContent = val ? 'Saved. Form closes ' + new Date(val).toLocaleString() + '.' : 'Saved.';
  }catch(e){ status.textContent = 'Could not save. Try again.'; }
}

async function clearDeadline(){
  document.getElementById('form-deadline-input').value = '';
  await saveDeadline();
}

async function saveFormDetails(){
  const val = document.getElementById('form-details-input').value.trim();
  const status = document.getElementById('form-details-status');
  status.innerHTML = '<span class="spinner"></span>Saving…';
  try{
    const res = await callBackend('saveSettings', { key:'formDetails', value: val });
    if(!res.ok) throw new Error(res.error);
    status.textContent = 'Saved.';
    loadFormDetails();
  }catch(e){ status.textContent = 'Could not save. Try again.'; }
}

async function changeAdminPassword(){
  const pw = document.getElementById('new-admin-pass').value;
  const status = document.getElementById('pass-status');
  if(!pw){ status.textContent = 'Enter a new password.'; return; }
  status.innerHTML = '<span class="spinner"></span>Updating…';
  try{
    const res = await callBackend('changePassword', { mobile: currentUser.mobile, role:'admin', newPasswordHash: simpleHash(pw) });
    status.textContent = res.ok ? 'Password updated.' : (res.error || 'Could not update.');
  }catch(e){ status.textContent = 'Could not reach the sheet.'; }
}

init();
</script>
